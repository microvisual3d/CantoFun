<!DOCTYPE html>
<html lang="zh-HK" data-world="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFE07A">
<title>中文樂</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=LXGW+WenKai+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#23263A; --line:#23263A; --surface:#FFFFFF; --surface2:#F4F7FB; --muted:#5B6680;
  --good:#2BB673; --outline:#E3E7EE; --grid:#F2B8B3;
  --bg:#FFE07A; --accent:#E63B2E; --accent2:#FFC83D; --accent3:#3D8BFF; --soft:#FFF3C4; --on-accent:#FFFFFF;
  --latin:"Baloo 2","Nunito",system-ui,sans-serif;
  --zh:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Sans TC","PingFang HK",serif;
  font-family:var(--latin); color:var(--ink);
}
:root[data-world="truck"]{--bg:#BFE8FF;--accent:#E63B2E;--accent2:#FFC83D;--accent3:#3D8BFF;--soft:#E3F5FF;--grid:#F2B8B3;}
:root[data-world="princess"]{--bg:#FFE3F0;--accent:#E94F9A;--accent2:#F5C542;--accent3:#9B7BFF;--soft:#FFF0F7;--grid:#F6B5D3;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ink:#F3F5FF;--line:#0B0E1C;--surface:#2A3352;--surface2:#222A45;--muted:#AEB7D6;--outline:#3B456A;--bg:#2B2A1A;--soft:#3A3722;--grid:#6A4048;}
  :root:not([data-theme="light"])[data-world="truck"]{--bg:#16213B;--soft:#1F2D4D;--grid:#6A4048;}
  :root:not([data-theme="light"])[data-world="princess"]{--bg:#2A1832;--surface:#3E2650;--surface2:#33203F;--soft:#3A2347;--outline:#55386A;--grid:#6B3D5C;}
}
:root[data-theme="dark"]{--ink:#F3F5FF;--line:#0B0E1C;--surface:#2A3352;--surface2:#222A45;--muted:#AEB7D6;--outline:#3B456A;--bg:#2B2A1A;--soft:#3A3722;--grid:#6A4048;}
:root[data-theme="dark"][data-world="truck"]{--bg:#16213B;--soft:#1F2D4D;}
:root[data-theme="dark"][data-world="princess"]{--bg:#2A1832;--surface:#3E2650;--surface2:#33203F;--soft:#3A2347;--outline:#55386A;--grid:#6B3D5C;}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background .4s}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.zh{font-family:var(--zh);font-weight:700}
.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;line-height:1}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px clamp(12px,2.5vw,28px) 16px;position:relative}

/* toy buttons: thick ink outline + hard drop */
.btn{border:3px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:8px 16px;font-weight:800;font-size:18px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active,.tile:active,.opt:active,.pcard:active,.chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
:is(.btn,.tile,.opt,.pcard,.chip,.mcard,.lvl):focus-visible{outline:4px solid var(--accent3);outline-offset:3px}
.icon-btn{width:58px;height:58px;border-radius:50%;padding:0;font-size:26px;display:grid;place-items:center}
.btn.small{font-size:16px;padding:6px 12px;border-radius:14px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.big{font-size:24px;padding:10px 22px;border-radius:22px}

.topbar{display:flex;align-items:center;gap:10px;min-height:58px}
.topbar .who{font-weight:800;font-size:clamp(20px,2.4vw,28px)}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:3px solid var(--line);border-radius:999px;padding:4px 16px;font-weight:800;font-size:22px;box-shadow:0 4px 0 var(--line)}
.pill.streak{background:var(--accent2);color:#23263A}
.pill b{min-width:1.2em;text-align:center}
.pill.bump{animation:bump .4s}

/* ---------- profiles ---------- */
.profiles{align-items:center;justify-content:center;gap:clamp(16px,3vh,32px)}
.ptop{text-align:center;position:relative;width:100%}
.title{font-size:clamp(56px,9vw,104px);margin:0;line-height:1;letter-spacing:.04em;color:var(--ink);text-shadow:0 5px 0 rgba(0,0,0,.08)}
.sub{margin:6px 0 0;font-size:clamp(20px,2.4vw,28px);font-weight:700;color:var(--muted)}
.corner{position:absolute;top:0;right:0;display:flex;gap:8px}
.pcards{display:flex;gap:clamp(16px,4vw,48px);flex-wrap:wrap;justify-content:center}
.pcard{width:min(40vw,340px);aspect-ratio:4/5;border:4px solid #23263A;border-radius:32px;box-shadow:0 8px 0 #23263A;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px;gap:6px;color:#23263A;transition:transform .08s,box-shadow .08s;position:relative;overflow:hidden}
.pcard.w-truck{background:linear-gradient(#BFE8FF 0 66%,#5B6A80 66% 100%)}
.pcard.w-truck::after{content:"";position:absolute;left:0;right:0;top:79%;height:5px;background:repeating-linear-gradient(90deg,#FFC83D 0 26px,transparent 26px 48px)}
.pcard.w-princess{background:linear-gradient(#FFE3F0 0 66%,#9EE3B8 66% 100%)}
.pav{flex:1;display:grid;place-items:center;width:100%;position:relative;z-index:1}
.pav svg{width:88%;max-height:100%}
.pname{font-size:clamp(22px,2.8vw,32px);font-weight:800;background:#FFFFFF;border:3px solid #23263A;border-radius:999px;padding:2px 18px;position:relative;z-index:1}
.pcard .pname{font-size:clamp(17px,2.1vw,25px);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.pcard .pav{min-height:0;overflow:hidden}
.pmeta{display:flex;gap:10px;font-weight:800;font-size:18px;position:relative;z-index:1;color:#FFFFFF;text-shadow:0 2px 0 rgba(0,0,0,.35)}
@media (orientation:portrait){.pcard{width:min(42vw,320px)}}

/* ---------- home ---------- */
.homegrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:clamp(12px,2.5vw,32px);align-items:stretch}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--soft);border:4px solid var(--line);border-radius:40px;padding:16px}
.hero svg{width:min(100%,360px)}
.levels{display:flex;align-items:center;gap:8px}
.lvl-label{font-weight:800;font-size:18px;color:var(--muted);margin-right:4px}
.lvl{width:52px;height:52px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-weight:800;font-size:22px;box-shadow:0 4px 0 var(--line);cursor:pointer;opacity:.55}
.lvl.on{background:var(--accent2);opacity:1;color:#23263A}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1.15fr 1fr 1fr;gap:clamp(10px,1.8vw,20px)}
.tile{border:4px solid var(--line);border-radius:28px;box-shadow:0 7px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:var(--surface);transition:transform .08s,box-shadow .08s;padding:8px}
.tile .big{font-size:clamp(34px,7vmin,70px)}
.tile .zh{font-size:clamp(20px,3.6vmin,34px);line-height:1.1}
.tile .en{font-size:clamp(15px,1.6vw,20px);font-weight:700;opacity:.8}
.t-mission{grid-column:1 / -1;background:var(--accent);color:var(--on-accent);flex-direction:row;gap:clamp(12px,3vw,32px)}
.t-mission .txt{display:flex;flex-direction:column;align-items:flex-start}
.t-trace{background:var(--accent2);color:#23263A}
.t-memory{background:var(--accent3);color:#FFFFFF}
@media (orientation:portrait){.homegrid{grid-template-columns:1fr;grid-template-rows:auto 1fr}.hero{flex-direction:row;padding:12px 20px}.hero svg{width:min(42%,260px)}.levels{flex-wrap:wrap}}

/* ---------- rice grid (米字格) ---------- */
.ricebox{position:relative;aspect-ratio:1;background:var(--surface);border:4px solid var(--accent);border-radius:14px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grid path{fill:none;stroke:var(--grid);stroke-width:2;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
.glyph{position:absolute;inset:7%;width:86%;height:86%;color:var(--ink);pointer-events:none}
.glyph path{fill:currentColor}

/* ---------- mission ---------- */
.track{position:relative;height:clamp(64px,10vh,84px);border:4px solid var(--line);border-radius:999px;flex-shrink:0}
.w-truck .track{background:#5B6A80}
.w-truck .track::before{content:"";position:absolute;left:4%;right:4%;top:calc(50% - 3px);height:6px;background:repeating-linear-gradient(90deg,#FFC83D 0 28px,transparent 28px 52px)}
.w-princess .track{background:#D9C9FF}
.w-princess .track::before{content:"";position:absolute;left:4%;right:4%;top:calc(50% - 4px);height:8px;background:radial-gradient(circle,#FFFFFF 3px,transparent 4px) 0 0/22px 8px repeat-x}
.stop{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:clamp(26px,3.6vh,36px);transition:opacity .4s,transform .4s}
.stop.past{opacity:.35;transform:translate(-50%,-50%) scale(.8)}
.rider{position:absolute;bottom:18%;transform:translateX(-50%);transition:left 1s cubic-bezier(.5,1.6,.5,1);z-index:2}
.rider svg{display:block}
.w-truck .rider svg{width:clamp(78px,11vh,104px)}
.w-princess .rider svg{width:clamp(48px,7vh,64px)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:12px}
.qcard{width:min(46vw,36vh,340px);cursor:pointer}
.qcard .bigpic{position:absolute;inset:0;display:grid;place-items:center;font-size:min(22vw,17vh,160px)}
.speak{position:absolute;right:8px;bottom:8px;width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--accent2);font-size:24px;display:grid;place-items:center;cursor:pointer;color:#23263A}
@media (orientation:portrait){.qcard{width:min(66vw,38vh,460px)}.opt{--osz:min(28vw,20vh,220px)}}
.opts{display:flex;gap:clamp(14px,3.5vw,40px);justify-content:center}
.opt{--osz:min(26vw,23vh,190px);width:var(--osz);height:var(--osz);border:4px solid var(--line);border-radius:26px;background:var(--surface);box-shadow:0 7px 0 var(--line);cursor:pointer;display:grid;place-items:center;font-size:calc(var(--osz)*.5);position:relative;transition:transform .08s,box-shadow .08s,background .2s;padding:0}
.opt.ricebox{border-radius:26px;border-color:var(--line)}
.opt .emo{font-size:calc(var(--osz)*.42);letter-spacing:-.08em}
.opt:not(.ricebox){display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.enlab{font-family:var(--latin);font-weight:800;font-size:clamp(15px,2.2vh,22px);line-height:1.05;color:var(--muted);text-align:center;padding:0 6px}
.opt.right .enlab,.mcard.done .enlab{color:#FFFFFF}
.qcard .qlab{position:absolute;left:12px;right:68px;bottom:14px;text-align:center;font-weight:800;font-size:clamp(18px,2.8vh,28px);color:var(--muted)}
.face.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.opt .emo.multi{font-size:calc(var(--osz)*.24)}
.opt.right{background:var(--good);animation:pop .5s}
.opt.right .glyph{color:#FFFFFF}
.opt.wrong{animation:shake .4s;opacity:.35;filter:grayscale(1);pointer-events:none}
.praise{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--zh);font-weight:700;font-size:clamp(48px,9vw,96px);color:var(--accent);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;pointer-events:none;z-index:40;animation:praise 1.2s forwards}

/* ---------- trace ---------- */
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 10px;flex-shrink:0;scrollbar-width:none}
.chip{flex:0 0 auto;width:68px;height:68px;border-radius:16px;border:3px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);position:relative;cursor:pointer;padding:0}
.chip .glyph{inset:12%;width:76%;height:76%}
.chip.on{background:var(--accent2)}
.chip.on .glyph{color:#23263A}
.chip.done::after{content:"⭐";position:absolute;right:-6px;top:-8px;font-size:18px}
.tstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,40px)}
.tbox{width:min(62vh,86vw,540px);border-width:5px}
#hw{position:absolute;inset:0}
#hw svg{display:block}
.tctrl{display:flex;flex-direction:column;gap:16px}
.tctrl .btn{font-size:36px;width:92px;height:80px;padding:0}
@media (orientation:portrait){.tstage{flex-direction:column}.tctrl{flex-direction:row}}
.alive{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:min(30vh,240px);opacity:0}
.alive.show{animation:alive 1.8s forwards}
.alive.flame span{animation:flicker .25s infinite alternate}
.alive.drip span{animation:drip .6s infinite}
.alive.spin span{animation:spin 1.6s linear infinite}
.alive.beat span{animation:beat .5s infinite}
.alive.bounce span{animation:bounceY .5s infinite alternate}
.alive span{display:inline-block}

/* ---------- memory ---------- */
.mgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,var(--msz));grid-auto-rows:var(--msz);gap:clamp(12px,2.5vw,26px);justify-content:center;align-content:center;--msz:min(20vw,34vh,230px)}
@media (orientation:portrait){.mgrid{grid-template-columns:repeat(2,var(--msz));--msz:min(38vw,18vh,230px)}}
.mcard{perspective:800px;border:0;background:none;padding:0;cursor:pointer}
.mcard .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .inner,.mcard.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);display:grid;place-items:center;overflow:hidden}
.face.back{background:var(--accent);background-image:radial-gradient(circle at 25% 25%,rgba(255,255,255,.25) 0 12%,transparent 13%),radial-gradient(circle at 75% 75%,rgba(255,255,255,.25) 0 12%,transparent 13%);font-size:calc(var(--msz)*.38)}
.face.front{transform:rotateY(180deg);background:var(--surface);font-size:calc(var(--msz)*.5)}
.face.front .multi{font-size:calc(var(--msz)*.24)}
.mcard.done .face.front{background:var(--good);border-color:var(--line)}
.mcard.done .glyph{color:#FFFFFF}

/* ---------- stickers ---------- */
.sgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;padding:6px 4px 20px;align-content:start}
.stk{aspect-ratio:1;border-radius:50%;border:4px solid var(--line);background:var(--surface);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;padding:0}
.stk .emo{font-size:46px}
.stk .emo.multi{font-size:24px}
.stk .zh{font-size:24px}
.stk.locked{background:transparent;border-style:dashed;box-shadow:none;color:var(--muted);font-size:34px;font-weight:800}
.shead{display:flex;align-items:baseline;gap:12px}
.shead h2{margin:0;font-size:clamp(26px,3vw,36px)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,18,40,.5);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .25s}
.modal{background:var(--surface);border:4px solid var(--line);border-radius:32px;box-shadow:0 10px 0 var(--line);padding:clamp(18px,3vw,32px);text-align:center;width:min(560px,94vw);max-height:92%;overflow:auto;animation:pop .4s}
.modal .art svg{width:min(260px,60vw)}
.modal h2{margin:8px 0 2px;font-size:clamp(40px,6vw,64px);line-height:1.1}
.modal p{margin:4px 0 16px;font-size:20px;font-weight:700;color:var(--muted)}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bigemo{font-size:96px;display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:999px;font-weight:800;z-index:80;animation:fade .2s}
.spark{position:fixed;font-size:30px;pointer-events:none;z-index:60;transform:translate(-50%,-50%);animation:spark .9s ease-out forwards}

/* ---------- minigame ---------- */
.mini{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));gap:10px}
.mini.m-truck{background:linear-gradient(#1E2B52,#3A4C80)}
.mini.m-princess{background:linear-gradient(#FFD1E6,#E6D6FF)}
.mbar{display:flex;align-items:center;gap:12px}
.mtime{flex:1;height:22px;border:3px solid #23263A;border-radius:999px;background:#FFFFFF;overflow:hidden}
.mtime i{display:block;height:100%;background:var(--accent2);width:100%;transition:width .1s linear}
.mfield{flex:1;position:relative;border-radius:24px;overflow:hidden;border:4px solid #23263A;touch-action:none}
.m-truck .mfield{background:linear-gradient(#25356A 0 70%,#4B5568 70%)}
.m-princess .mfield{background:linear-gradient(#FFE9F3 0 72%,#9EE3B8 72%)}
.bld{position:absolute;bottom:30%;background:#5D6E99;border:3px solid #23263A;border-bottom:0;background-image:linear-gradient(#5D6E99 0 45%,transparent 45%),linear-gradient(90deg,transparent 18%,#FFE38A 18% 40%,transparent 40% 60%,#FFE38A 60% 82%,transparent 82%);background-size:100% 34px;background-position:0 0}
.castle{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);font-size:min(30vh,240px);opacity:.55}
.target{position:absolute;transform:translate(-50%,-50%) scale(0);border:0;background:none;padding:6px;font-size:clamp(54px,9vh,84px);cursor:pointer;animation:appear .25s forwards}
.target.hit{animation:vanish .45s forwards;pointer-events:none}
.jet{position:absolute;height:12px;border-radius:6px;background:linear-gradient(90deg,#9AD9FF,#E8F7FF);transform-origin:0 50%;pointer-events:none;animation:jet .35s forwards;border:2px solid #23263A}
.hero-mini{position:absolute;bottom:3%;pointer-events:none}
.m-truck .hero-mini{left:3%}
.m-truck .hero-mini svg{width:clamp(120px,18vw,200px)}
.m-princess .hero-mini{left:50%;transform:translateX(-50%)}
.m-princess .hero-mini svg{width:clamp(80px,11vw,130px)}
.mscore{font-size:30px;font-weight:800;color:#FFFFFF;text-shadow:0 3px 0 #23263A;min-width:90px;text-align:right}
.m-princess .mscore{color:#E94F9A;-webkit-text-stroke:2px #23263A;paint-order:stroke fill;text-shadow:none}

/* ---------- parent ---------- */
.parent{overflow-y:auto;gap:16px;color:var(--ink)}
.parent h2{margin:0;font-size:28px}
.parent h3{margin:0 0 10px;font-size:21px}
.ptabs{display:flex;gap:10px;flex-wrap:wrap}
.ptabs .btn.on{background:var(--accent2);color:#23263A}
.panel{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:15px;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.bars i{display:block;width:100%;max-width:44px;background:var(--accent3);border-radius:8px 8px 3px 3px;min-height:3px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:16px}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--surface2)}
th{font-size:14px;color:var(--muted)}
td.zhc{font-family:var(--zh);font-size:28px;font-weight:700}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:14px}

.prompt{position:relative;align-self:center;display:flex;align-items:center;gap:18px;background:var(--surface);border:4px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:10px 86px 10px 24px;min-height:96px;flex-shrink:0}

/* body game */
.bstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,80px)}

.buddy{height:min(76vh,640px);max-width:52vw;overflow:visible}

.qwide{margin:0 auto}
.t-read{background:#61C3F2;color:#23263A}.t-fill{background:#FFB86B;color:#23263A}.t-tf{background:#FFB3C1;color:#23263A}
.srow{flex-wrap:nowrap}
.fright .srow{--u4:min(8.5vw,9vh,78px)}
.fright .sbox{max-width:none}
@media (orientation:portrait){.fright .srow{--u4:min(13vw,8vh,90px)}}
.opt .pic:only-child{width:88%}
.read .opt{--osz:min(28vw,30vh,240px)}
.hero-anim .tladder{animation:ladderUp 8s ease-in-out infinite}
.hero-anim .hwater{opacity:0;animation:waterOn 8s linear infinite}
.hero-anim .hwater .core{stroke-dasharray:12 10;animation:flow2 .5s linear infinite}
.hero-anim .hdrop{animation:hdrop .8s ease-in infinite}
.hero-anim .pcrown{animation:crownFix 8s ease-in-out infinite}
.hero-anim .parmL{transform:rotate(25deg);animation:armL 8s linear infinite}
.hero-anim .parmUp{opacity:0;animation:armUp 8s linear infinite}
.hero-anim .parmR{animation:armR 8s ease-in-out infinite}
.hero-anim .pspark{opacity:0;animation:pspark 8s ease-in-out infinite}
.hero-anim .peyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}

/* ---------- figure helpers ---------- */
const limb=(x1,y1,x2,y2,col,w=5)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${K}" stroke-width="${w+4.5}" stroke-linecap="round"/><line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
const rad=d=>d*Math.PI/180;
/* mouth: smile | open | o | shout | flat ; eyesT: open | shut */
function kface(mouth='smile',eyesT='open'){
  const e=eyesT==='shut'?`<path d="M-9.5 0 q2.5 2.5 5 0 M4.5 0 q2.5 2.5 5 0" fill="none" ${sk(2.2)}/>`:eyes(0,0);
  const m={smile:`<path d="M-4 5.5 Q0 9.5 4 5.5" fill="none" ${sk(2.2)}/>`,open:`<ellipse cx="0" cy="7.5" rx="4" ry="4.5" fill="#7A1D2E" ${sk(2)}/>`,o:`<circle cx="0" cy="7" r="2.6" fill="#7A1D2E" ${sk(1.8)}/>`,shout:`<path d="M-6 4.5 Q0 3.5 6 4.5 Q5 14 0 14 Q-5 14 -6 4.5 Z" fill="#7A1D2E" ${sk(2)}/>`,flat:`<path d="M-3 6.5 H3" ${sk(2.2)}/>`}[mouth];
  return `${e}${m}<circle cx="-12.5" cy="5" r="2.8" fill="#FF8FA3" opacity=".75"/><circle cx="12.5" cy="5" r="2.8" fill="#FF8FA3" opacity=".75"/>`;}
/* child figure: origin at feet; arms/legs are angles from straight down (deg), +ve = outward */
function kid(x,y,s,o={}){const a=Object.assign({aL:20,aR:20,lL:8,lR:8,mouth:'smile',eyes:'open',hair:'boy',shirt:'#61C3F2',pants:'#3D4A6B',rot:0,hands:true},o);
  const arm=(side,ang)=>{const sx=side*10,sy=-42,ex=sx+side*Math.sin(rad(ang))*22,ey=sy+Math.cos(rad(ang))*22;return limb(sx,sy,ex,ey,a.shirt,5)+(a.hands?`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4.6" fill="${SKIN}" ${sk(2.6)}/>`:'');};
  const leg=(side,ang)=>{const sx=side*6,sy=-18,ex=sx+side*Math.sin(rad(ang))*17,ey=sy+Math.cos(rad(ang))*17;return limb(sx,sy,ex,ey,a.pants,5.5)+`<ellipse cx="${(ex+side*2).toFixed(1)}" cy="${(ey+1.5).toFixed(1)}" rx="5.5" ry="3.5" fill="${K}"/>`;};
  const hair=a.hair==='girl'?`<circle cx="-15" cy="-58" r="6" fill="#6B3E2E" ${sk(2.5)}/><circle cx="15" cy="-58" r="6" fill="#6B3E2E" ${sk(2.5)}/><path d="M-14 -62 Q-13 -78 0 -78 Q13 -78 14 -62 Q8 -70 0 -68 Q-8 -70 -14 -62 Z" fill="#6B3E2E" ${sk(2.6)}/>`
    :a.hair==='adultF'?`<path d="M-14 -64 Q-12 -79 0 -79 Q12 -79 14 -64 Q8 -71 0 -69 Q-8 -71 -14 -64 Z" fill="#4A2E22" ${sk(2.6)}/>`
    :a.hair==='adultM'?`<path d="M-14 -63 Q-13 -79 0 -79 Q13 -79 14 -63 Q8 -71 0 -70 Q-8 -71 -14 -63 Z" fill="#3B2A22" ${sk(2.6)}/>`

const SND={ctx:null,master:null,music:null,sfx:null,timer:null,playing:false,tempo:104,ei:0,loopStart:0};
function audioInit(){
  if(!SND.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    SND.ctx=new AC();SND.master=SND.ctx.createGain();SND.master.gain.value=.9;SND.master.connect(SND.ctx.destination);
    SND.music=SND.ctx.createGain();SND.music.gain.value=0;SND.music.connect(SND.master);
    SND.sfx=SND.ctx.createGain();SND.sfx.gain.value=.55;SND.sfx.connect(SND.master);}
  if(SND.ctx.state==='suspended')SND.ctx.resume();
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function bell(m,t,dur,g,dest){const c=SND.ctx;[[1,1],[2,.28],[3,.09]].forEach(([mul,amp],i)=>{const o=c.createOscillator(),v=c.createGain();o.type='sine';o.frequency.value=mf(m)*mul;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g*amp,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+dur/(1+i*.7));o.connect(v);v.connect(dest);o.start(t);o.stop(t+dur+.05);});}
function tone(f,t,dur,g,dest,type='triangle',f2){const c=SND.ctx,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(dest);o.start(t);o.stop(t+dur+.05);}
/* original music-box melody, 8 bars in C major */
const MEL=[[76,.5],[79,.5],[84,1],[79,1],[76,1],[77,.5],[81,.5],[84,1],[81,1],[77,1],[76,.5],[79,.5],[84,.5],[83,.5],[81,1],[79,1],[74,.5],[76,.5],[77,.5],[81,.5],[79,2],[76,.5],[79,.5],[84,1],[79,1],[76,1],[77,.5],[81,.5],[86,1],[84,1],[81,1],[79,.5],[77,.5],[76,.5],[74,.5],[76,1],[79,1],[72,3],[null,1]];
const BASS=[[48,55],[53,60],[48,55],[43,50],[48,55],[53,60],[43,50],[48,55]];
const EV=(()=>{let b=0;const ev=[];for(const[m,d]of MEL){if(m)ev.push({b,m,d,k:'m'});b+=d;}BASS.forEach((ch,i)=>{ev.push({b:i*4,m:ch[0],d:1.6,k:'b'});ev.push({b:i*4+2,m:ch[1],d:1.6,k:'b'});});return ev.sort((a,z)=>a.b-z.b);})();
const MUSIC_VOL=.07;
function musicStart(){if(!SND.ctx||SND.playing||!S.settings.music)return;SND.playing=true;SND.music.gain.cancelScheduledValues(SND.ctx.currentTime);SND.music.gain.setTargetAtTime(MUSIC_VOL,SND.ctx.currentTime,.4);SND.loopStart=SND.ctx.currentTime+.15;SND.ei=0;SND.timer=setInterval(schedule,60);}
function musicStop(){if(!SND.ctx)return;SND.playing=false;clearInterval(SND.timer);SND.music.gain.setTargetAtTime(0,SND.ctx.currentTime,.15);}
function setTempo(t){if(SND.tempo===t)return;SND.tempo=t;if(SND.playing){musicStop();setTimeout(musicStart,250);}}
function schedule(){const c=SND.ctx,spb=60/SND.tempo,ahead=c.currentTime+.3;let guard=0;
  while(guard++<64){const e=EV[SND.ei],t=SND.loopStart+e.b*spb;if(t>ahead)break;
    if(t>c.currentTime-.05){if(e.k==='m')bell(e.m,t,Math.max(.7,e.d*spb*1.7),.5,SND.music);else tone(mf(e.m),t,e.d*spb,.32,SND.music,'triangle');}
    SND.ei++;if(SND.ei>=EV.length){SND.ei=0;SND.loopStart+=32*spb;}}}
function duck(on){if(!SND.ctx||!SND.playing)return;SND.music.gain.setTargetAtTime(on?0:MUSIC_VOL,SND.ctx.currentTime,on?.03:.25);}
function sfx(name){if(!SND.ctx||!S.settings.sfx)return;const c=SND.ctx,t=c.currentTime+.01,d=SND.sfx;
  switch(name){
    case'correct':[84,88,91].forEach((m,i)=>bell(m,t+i*.08,.6,.6,d));break;
    case'wrong':tone(260,t,.28,.3,d,'triangle',170);break;
    case'buzz':tone(150,t,.38,.16,d,'square',120);tone(110,t+.02,.38,.12,d,'square',90);break;
    case'soft':tone(330,t,.15,.18,d,'sine',260);break;
    case'pop':tone(620,t,.09,.25,d,'sine',990);break;
    case'star':[91,96,100,103].forEach((m,i)=>bell(m,t+i*.06,.5,.45,d));break;
    case'fanfare':[72,76,79].forEach((m,i)=>bell(m,t+i*.12,.5,.55,d));[84,88].forEach(m=>bell(m,t+.4,1.4,.5,d));break;
    case'siren':for(let i=0;i<6;i++)tone(i%2?950:720,t+i*.28,.28,.09,d,'sine');break;
    case'splash':{const len=.35,buf=c.createBuffer(1,c.sampleRate*len,c.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),v=c.createGain();s.buffer=buf;f.type='bandpass';f.frequency.value=1400;f.Q.value=.7;v.gain.value=.5;s.connect(f);f.connect(v);v.connect(d);s.start(t);tone(900,t,.12,.12,d,'sine',1500);break;}
    case'sparkle':[96,100,103,108].forEach((m,i)=>bell(m+(Math.random()<.5?0:2),t+i*.045,.35,.35,d));break;
  }}
/* speech: device text-to-speech, Cantonese voice when installed */
let cantoVoice=null,voiceCount=0;
function loadVoices(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();voiceCount=vs.length;cantoVoice=vs.find(v=>/^(zh[-_]HK|yue)/i.test(v.lang))||vs.find(v=>/cantonese|粵|廣東|hong ?kong/i.test(v.name))||null;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let duckTimer=null;
function speak(text){if(!('speechSynthesis' in window)||!text)return;try{speechSynthesis.cancel();}catch(e){}
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(text);u.lang=cantoVoice?cantoVoice.lang:'zh-HK';if(cantoVoice)u.voice=cantoVoice;u.rate=S.settings.rate;
    duck(true);u.onend=u.onerror=()=>{clearTimeout(duckTimer);duckTimer=setTimeout(()=>duck(false),250);};clearTimeout(duckTimer);duckTimer=setTimeout(()=>duck(false),Math.max(1800,[...text].length*520/S.settings.rate+900));speechSynthesis.speak(u);},60);}

let BS=0;

function recordAnswer(c,first){BS=first?BS+1:0;const p=cur(),w=ws(p,c);w.seen++;w.last=Date.now();
  if(first){w.ok++;w.box=Math.min(4,w.box+1);}else{w.bad++;w.box=Math.max(0,w.box-1);}
  if(w.box>=2&&!p.stickers.includes(c)){p.stickers.push(c);setTimeout(()=>{toast('New sticker! '+c);sfx('star');},900);}
  save();}
function weight(p,w){const s=p.words[w.c];if(!s||!s.seen)return 3;return [4,3,2,1,.5][s.box];}
function pickWords(n,maxNew=3,filt){const p=cur();let pool=WORDS.filter(w=>w.lvl===lvl()&&(!filt||filt(w))),out=[],newCount=0;
  while(out.length<n&&pool.length){const ok=pool.filter(w=>{const s=p.words[w.c];return newCount<maxNew||(s&&s.seen);});const src=ok.length?ok:pool;
    const tot=src.reduce((a,w)=>a+weight(p,w),0);let r=Math.random()*tot,ch=src[src.length-1];for(const w of src){r-=weight(p,w);if(r<=0){ch=w;break;}}
    const s=p.words[ch.c];if(!s||!s.seen)newCount++;out.push(ch);pool=pool.filter(w=>w!==ch);}
  return out;}
function distractors(w,n=2){const bad=new Set([w.c,...(w.avoid||[])]);return shuffle(WORDS.filter(x=>x.lvl===w.lvl&&!bad.has(x.c)&&!(x.avoid||[]).includes(w.c))).slice(0,n);}

 sayq:()=>{if(M)speak(M.qs[M.i].w.c);},
 answer:(d,el)=>answer(+d.k,el),
 bonusGo:()=>{startMinigame(()=>{const a=bonusAfter;bonusAfter=null;a&&a();});},
 trace:()=>{T.c=null;go('trace');},
 tchar:d=>setTraceChar(d.c),
 twatch:()=>{const a=$('#alive');if(a)a.className='alive';watchThenQuiz();},
 tsay:()=>speak(sayOf(TW(T.c))),
 tnext:()=>{const it=traceItems(),i=it.findIndex(w=>w.c===T.c);setTraceChar(it[(i+1)%it.length].c);},
 memory:()=>startMemory(),
 mflip:(d,el)=>flip(+d.i,el),
 stickers:()=>go('stickers'),
 saystk:(d,el)=>{const w=W(d.c);speak(w.c+(w.hint?'，'+w.hint:''));sfx('pop');burst(el,6);},
 locked:()=>{sfx('soft');toast('Coming soon 🔒');},
 noop:()=>{},
 parent:()=>showGate(()=>{parentTab=0;go('parent');}),
 ptab:d=>{parentTab=+d.i;go('parent');},
 theme:d=>{S.profiles[parentTab].theme=d.t;save();go('parent');},
 set:d=>{S.settings[d.k]=d.v==='1';save();if(d.k==='music'){S.settings.music?musicStart():musicStop();}go('parent');},
 testVoice:()=>speak('你好！我哋一齊學中文。'),
 reset:(d,el)=>{if(el.dataset.armed){const p=S.profiles[parentTab];S.profiles[parentTab]=newProfile(p.id,p.name,p.theme);save();go('parent');toast('Progress reset');}else{el.dataset.armed='1';el.textContent='Tap again to confirm';el.classList.add('primary');setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Reset '+S.profiles[parentTab].name;el.classList.remove('primary');}},3000);}},
 gk:d=>gateKey(d.k),
 restSwitch:()=>{restShown=false;closeOverlay();ACT.profiles();},
 restMore:()=>{const p=cur();showGate(()=>{const k=dayKey();p.bonusMin[k]=(p.bonusMin[k]||0)+10;save();restShown=false;toast('+10 minutes');});restShown=true;},
 read:()=>startRead(),readpick:(d,el)=>readPick(+d.k,el),fill:()=>startFill(),fillpick:(d,el)=>fillPick(+d.k,el),tf:()=>startTF(),tfans:(d,el)=>tfAns(+d.v,el),
 backup:()=>{try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='zhongwenle-backup-'+dayKey()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded');}catch(e){toast('Download not available here');}},
 sfopen:()=>{SF.c=null;go('sfix');},sfback:()=>go('parent'),
 sfpick:d=>{SF.c=d.c;SF.order=(S.strokeFix[d.c]||[]).slice();go('sfix');},
 sftap:d=>{const i=+d.i;if(!SF.order.includes(i)){SF.order.push(i);sfDraw();}},
 sfundo:()=>{SF.order.pop();sfDraw();},sfclear:()=>{SF.order=[];sfDraw();},sfprev:()=>sfPreview(),
 sfsave:()=>{const n=CHAR_DATA[SF.c].strokes.length;if(SF.order.length!==n){toast('Tap all '+n+' strokes first');return;}S.strokeFix[SF.c]=SF.order.slice();save();toast('Saved');go('sfix');},
 sfrestore:()=>{delete S.strokeFix[SF.c];SF.order=[];save();toast('Original order restored');go('sfix');},
 sfcopy:()=>sfCopy(),sfclose:()=>closeOverlay(),
 build:()=>startBuild(),btile:d=>buildTile(+d.k),bslot:d=>buildSlot(+d.k),
 sort:()=>startSort(),sortpick:(d,el)=>sortPick(+d.k,el),
 setlvl:d=>{const p=cur();p.level=+d.n;save();T.c=null;go('home');speak(['第一級','第二級','第三級','第四級'][+d.n-1]);},
 body:()=>startBody(),pop:()=>startPop(),fork:()=>startFork(),
 sayb:()=>{if(B)speak(B.r[B.i].c);},sayw:d=>speak(d.c),
 bodytap:(d,el)=>bodyTap(d.part,el),forkpick:(d,el)=>forkPick(+d.k,el),
 race:()=>raceSetup(),raceSwap:()=>{[RS.a,RS.b]=[RS.b,RS.a];RS.head=RS.head===1?2:RS.head===2?1:0;raceSetup();},raceHead:d=>{RS.head=+d.v;raceSetup();},raceGo:()=>startRace(),raceCancel:()=>closeOverlay(),raceQuit:()=>{R=null;go('profiles');},
 fullscreen:()=>{try{const d=document.documentElement;if(!document.fullscreenElement)(d.requestFullscreen||d.webkitRequestFullscreen).call(d);else document.exitFullscreen();}catch(e){toast('Full screen is not available here');}}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;audioInit();if(S.settings.music&&!SND.playing)musicStart();
  if(a.matches('button')&&!a.classList.contains('opt')&&!a.classList.contains('mcard')&&a.dataset.act!=='gk')sfx('pop');
  const f=ACT[a.dataset.act];if(f){e.stopPropagation();f(a.dataset,a,e);}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-race]');if(!b)return;e.preventDefault();audioInit();if(S.settings.music&&!SND.playing)musicStart();raceTap(+b.dataset.race,+b.dataset.k,b);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const k=el.dataset.chg,p=S.profiles[parentTab];
  if(k==='restore'){const f=el.files&&el.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d||!Array.isArray(d.profiles))throw 0;memStore=d;try{localStorage.setItem(KEY,t);}catch(_){}S=load();S.strokeFix=S.strokeFix||{};parentTab=0;go('parent');toast('Progress restored');}).catch(()=>toast('That file is not a 中文樂 backup'));return;}
  if(k==='name'){p.name=el.value.trim()||p.name;save();go('parent');}
  if(k==='limit'){S.settings.limit=+el.value;save();}
  if(k==='rate'){S.settings.rate=+el.value;save();speak('你好');}});
document.addEventListener('visibilitychange',()=>{if(!SND.ctx)return;if(document.hidden){SND.ctx.suspend();try{speechSynthesis.cancel();}catch(e){}}else SND.ctx.resume();});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(screen==='trace')initWriter();},300);});

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
go('profiles');
</script>
